<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 72" width="688" height="144" role="img" aria-label="Mawa Homebazar BD">
  <!-- Emblem: shopping bag with an M monogram and a gold handle. -->
  <g transform="translate(4 4)">
    <path d="M22 26V20a10 10 0 0 1 20 0v6" fill="none" stroke="#E3A72F" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M12.5 24h39a3.5 3.5 0 0 1 3.49 3.82l-2.4 26.5A6 6 0 0 1 46.6 60H17.4a6 6 0 0 1-5.98-5.68l-2.4-26.5A3.5 3.5 0 0 1 12.5 24Z" fill="#3A6451"/>
    <path d="M23.5 48V36.5l8.5 8 8.5-8V48" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark. Poppins is the brand face; the fallbacks keep the file legible
       anywhere it is opened outside the site. `textLength` pins the width so a
       substituted fallback face cannot push "BD" past the viewBox edge. -->
  <text x="76" y="38" textLength="256" lengthAdjust="spacingAndGlyphs"
        font-family="Poppins, 'Segoe UI', system-ui, Arial, sans-serif"
        font-size="21" font-weight="700" fill="#3A6451">MAWA HOMEBAZAR <tspan fill="#E3A72F">BD</tspan></text>
  <text x="77" y="52" textLength="232" lengthAdjust="spacing"
        font-family="Poppins, 'Segoe UI', system-ui, Arial, sans-serif"
        font-size="7.5" font-weight="600" fill="#2F5241">ONLINE BAZAR · BANGLADESH</text>
</svg>
